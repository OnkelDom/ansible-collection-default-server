---
- name: Validate supported platform
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
    fail_msg: "The k3s_network role supports Debian-family systems only."
  tags: k3s_network

- name: Install ifupdown helpers
  ansible.builtin.package:
    name:
      - ifupdown
      - ifupdown-extra
    state: present
  become: true
  tags: k3s_network

- name: Ensure interfaces.d include exists
  ansible.builtin.lineinfile:
    path: /etc/network/interfaces
    line: source /etc/network/interfaces.d/*
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: k3s_network

- name: Configure k3s extra interfaces
  ansible.builtin.template:
    src: k3s-extra.interfaces.j2
    dest: "{{ k3s_network_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload k3s extra interfaces
  become: true
  tags: k3s_network

