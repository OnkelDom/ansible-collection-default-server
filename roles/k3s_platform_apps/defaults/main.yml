---
k3s_platform_apps_work_dir: /root/k3s-platform-apps
k3s_platform_apps_namespace: platform-bus
k3s_platform_apps_ingress_class: traefik
k3s_platform_apps_cluster_domain: k3s.lenmail.de
k3s_platform_apps_product_domain: bus.lenmail.de
k3s_platform_apps_acme_cluster_issuer: letsencrypt-hetzner
k3s_platform_apps_network_policy_enabled: true
k3s_platform_apps_forwardauth_enabled: true
k3s_platform_apps_forwardauth_address: "http://authentik-server.platform-bus.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik"
k3s_platform_apps_product_aliases_enabled: false
k3s_platform_apps_homeassistant_enabled: false
k3s_platform_apps_homeassistant_domain: assi.lenmail.de
k3s_platform_apps_homeassistant_address: 10.30.30.15
k3s_platform_apps_homeassistant_port: 8123
k3s_platform_apps_ceph_dashboard_enabled: false
k3s_platform_apps_ceph_dashboard_domain: storage.bus.lenmail.de
k3s_platform_apps_ceph_dashboard_addresses: []
k3s_platform_apps_ceph_dashboard_port: 8443
k3s_platform_apps_synology_enabled: false
k3s_platform_apps_synology_address: 172.16.2.4
k3s_platform_apps_synology_https_port: 443
k3s_platform_apps_synology_domains: []
k3s_platform_apps_opencloud_enabled: false
k3s_platform_apps_opencloud_address: 10.30.30.23
k3s_platform_apps_opencloud_domain: cloud.bus.lenmail.de
k3s_platform_apps_opencloud_port: 9200
k3s_platform_apps_collabora_domain: office.bus.lenmail.de
k3s_platform_apps_collabora_port: 9980
k3s_platform_apps_opencloud_node_exporter_port: 9100

k3s_platform_apps_homepage_enabled: true
k3s_platform_apps_homepage_image: "ghcr.io/gethomepage/homepage:latest"
k3s_platform_apps_homepage_domain: "portal.k3s.lenmail.de"
k3s_platform_apps_homepage_replicas: 2
k3s_platform_apps_homepage_title: "PlattformBUS k3s"

k3s_platform_apps_blackbox_enabled: true
k3s_platform_apps_blackbox_image: "prom/blackbox-exporter:latest"
k3s_platform_apps_blackbox_targets:
  - name: portal
    url: "http://portal.k3s.lenmail.de"
    tier: access
    criticality: mid
  - name: dash
    url: "http://dash.k3s.lenmail.de"
    tier: observability
    criticality: high

k3s_platform_apps_dashboard_enabled: true
k3s_platform_apps_dashboard_name: platform-bus-k3s-operations.json

k3s_platform_apps_runtime_secret_name: platform-bus-runtime-env
k3s_platform_apps_runtime_env: {}
k3s_platform_apps_runtime_env_keys:
  - TZ
  - POSTGRES_DB
  - POSTGRES_SUPERUSER
  - POSTGRES_SUPERPASS
  - AUTHENTIK_DB
  - AUTHENTIK_DB_USER
  - AUTHENTIK_DB_PASS
  - GITEA_DB
  - GITEA_DB_USER
  - GITEA_DB_PASS
  - SEMAPHORE_DB
  - SEMAPHORE_DB_USER
  - SEMAPHORE_DB_PASS
  - OUTLINE_DB
  - OUTLINE_DB_USER
  - OUTLINE_DB_PASS
  - OUTLINE_OIDC_CLIENT_ID
  - OUTLINE_OIDC_CLIENT_SECRET
  - NETBOX_DB
  - NETBOX_DB_USER
  - NETBOX_DB_PASS
  - NETBOX_ALLOWED_HOSTS
  - NETBOX_BRANCHING_ENABLED
  - NETBOX_OIDC_CLIENT_ID
  - NETBOX_OIDC_CLIENT_SECRET
  - GRAFANA_DB
  - GRAFANA_DB_USER
  - GRAFANA_DB_PASS
  - PDNS_DB
  - PDNS_DB_USER
  - PDNS_DB_PASS
  - PDNS_ADMIN_DB
  - PDNS_ADMIN_DB_USER
  - PDNS_ADMIN_DB_PASS
  - N8N_DB
  - N8N_DB_USER
  - N8N_DB_PASS
  - AUTHENTIK_SECRET_KEY
  - AUTHENTIK_BOOTSTRAP_EMAIL
  - AUTHENTIK_BOOTSTRAP_PASSWORD
  - AUTHENTIK_BOOTSTRAP_TOKEN
  - GITEA_SECRET_KEY
  - GITEA_INTERNAL_TOKEN
  - GITEA_LFS_JWT_SECRET
  - GITEA_RUNNER_REGISTRATION_TOKEN
  - SEMAPHORE_ACCESS_KEY_ENCRYPTION
  - SEMAPHORE_ADMIN
  - SEMAPHORE_ADMIN_PASSWORD
  - SEMAPHORE_ADMIN_NAME
  - SEMAPHORE_ADMIN_EMAIL
  - SEMAPHORE_API_TOKEN
  - SEMAPHORE_RUNNER_TOKEN
  - SEMAPHORE_OIDC_CLIENT_ID
  - SEMAPHORE_OIDC_CLIENT_SECRET
  - OUTLINE_SECRET_KEY
  - OUTLINE_UTILS_SECRET
  - NETBOX_SECRET_KEY
  - NETBOX_API_TOKEN_PEPPER
  - NETBOX_SUPERUSER_NAME
  - NETBOX_SUPERUSER_EMAIL
  - NETBOX_SUPERUSER_PASSWORD
  - NETBOX_API_TOKEN
  - N8N_ENCRYPTION_KEY
  - SMTP_HOST
  - SMTP_PORT
  - SMTP_FROM
  - SMTP_USERNAME
  - SMTP_PASSWORD
  - SMTP_TLS

k3s_platform_apps_data_services_enabled: false
k3s_platform_apps_postgres_enabled: true
k3s_platform_apps_redis_enabled: true
k3s_platform_apps_postgres_host: postgres
k3s_platform_apps_postgres_image: "docker.io/library/postgres:16"
k3s_platform_apps_postgres_storage_size: 50Gi
k3s_platform_apps_redis_image: "docker.io/library/redis:8-alpine"
k3s_platform_apps_redis_storage_size: 10Gi

k3s_platform_apps_loki_enabled: false
k3s_platform_apps_loki_image: "docker.io/grafana/loki:latest"
k3s_platform_apps_loki_domain: "logs.k3s.lenmail.de"
k3s_platform_apps_loki_storage_size: 20Gi
k3s_platform_apps_loki_retention: 30d

k3s_platform_apps_tempo_enabled: false
k3s_platform_apps_tempo_image: "docker.io/grafana/tempo:latest"
k3s_platform_apps_tempo_domain: "traces.k3s.lenmail.de"
k3s_platform_apps_tempo_storage_size: 20Gi

k3s_platform_apps_n8n_enabled: false
k3s_platform_apps_n8n_image: "docker.n8n.io/n8nio/n8n:latest"
k3s_platform_apps_n8n_domain: "n8n.k3s.lenmail.de"
k3s_platform_apps_n8n_replicas: 1
k3s_platform_apps_n8n_storage_size: 10Gi

k3s_platform_apps_outline_enabled: false
k3s_platform_apps_outline_image: "docker.getoutline.com/outlinewiki/outline:latest"
k3s_platform_apps_outline_domain: "wiki.k3s.lenmail.de"
k3s_platform_apps_outline_replicas: 1
k3s_platform_apps_outline_storage_size: 10Gi
k3s_platform_apps_authentik_domain: "auth.k3s.lenmail.de"

k3s_platform_apps_authentik_enabled: false
k3s_platform_apps_authentik_image: "ghcr.io/goauthentik/server:latest"
k3s_platform_apps_authentik_app_domain: "auth.k3s.lenmail.de"
k3s_platform_apps_authentik_server_replicas: 1
k3s_platform_apps_authentik_worker_replicas: 1
k3s_platform_apps_authentik_media_storage_size: 10Gi
k3s_platform_apps_authentik_templates_storage_size: 1Gi
k3s_platform_apps_authentik_node_selector: {}

k3s_platform_apps_gitea_enabled: false
k3s_platform_apps_gitea_image: "docker.io/gitea/gitea:latest"
k3s_platform_apps_gitea_domain: "git.k3s.lenmail.de"
k3s_platform_apps_gitea_public_domain: "git.bus.lenmail.de"
k3s_platform_apps_gitea_replicas: 1
k3s_platform_apps_gitea_storage_size: 20Gi
k3s_platform_apps_gitea_ssh_domain: "git.k3s.lenmail.de"
k3s_platform_apps_gitea_ssh_port: 2222
k3s_platform_apps_gitea_default_theme: "gitea-auto"
k3s_platform_apps_gitea_ssh_ingress_enabled: true
k3s_platform_apps_gitea_runner_enabled: false
k3s_platform_apps_gitea_runner_image: "docker.io/gitea/act_runner:latest"
k3s_platform_apps_gitea_runner_dind_image: "docker.io/library/docker:27-dind"
k3s_platform_apps_gitea_runner_replicas: 1
k3s_platform_apps_gitea_runner_name: "platform-bus-k3s-runner"
k3s_platform_apps_gitea_runner_labels: "ubuntu-latest:docker://node:20-bookworm,alpine-latest:docker://alpine:3.20"
k3s_platform_apps_gitea_runner_storage_size: 5Gi

k3s_platform_apps_semaphore_enabled: false
k3s_platform_apps_semaphore_image: "docker.io/semaphoreui/semaphore:latest"
k3s_platform_apps_semaphore_domain: "ops.k3s.lenmail.de"
k3s_platform_apps_semaphore_replicas: 1
k3s_platform_apps_semaphore_storage_size: 10Gi
k3s_platform_apps_semaphore_runner_enabled: false
k3s_platform_apps_semaphore_runner_image: "docker.io/semaphoreui/runner:latest"
k3s_platform_apps_semaphore_runner_replicas: 1
k3s_platform_apps_semaphore_runner_name: "platform-bus-k3s-runner"

k3s_platform_apps_netbox_enabled: false
k3s_platform_apps_netbox_image: "netboxcommunity/netbox:latest"
k3s_platform_apps_netbox_domain: "cmdb.k3s.lenmail.de"
k3s_platform_apps_netbox_replicas: 1
k3s_platform_apps_netbox_worker_replicas: 1
k3s_platform_apps_netbox_storage_size: 10Gi
k3s_platform_apps_netbox_node_selector: {}
