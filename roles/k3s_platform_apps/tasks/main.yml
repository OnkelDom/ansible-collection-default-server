- name: Wait for platform PostgreSQL rollout
  ansible.builtin.command:
    cmd: "kubectl -n {{ k3s_platform_apps_namespace }} rollout status statefulset/postgres --timeout=300s"
  register: k3s_platform_apps_postgres_rollout
  until: k3s_platform_apps_postgres_rollout.rc == 0
  retries: 20
