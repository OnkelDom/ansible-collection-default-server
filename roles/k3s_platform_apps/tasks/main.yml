    - k3s_platform_apps_authentik_worker_replicas | int > 0
  tags: k3s_platform_apps

- name: Reconcile Authentik redirect URIs for k3s app domains
  ansible.builtin.shell: |
    set -euo pipefail
    pod=$(kubectl -n {{ k3s_platform_apps_namespace }} get pod -l app.kubernetes.io/name=authentik-server -o name | head -n1 | cut -d/ -f2)
    timeout 180s kubectl -n {{ k3s_platform_apps_namespace }} exec -i "$pod" -- env AUTHENTIK_LOG_LEVEL=warning python /manage.py shell <<'PY'
    from authentik.providers.oauth2.models import OAuth2Provider

    expected = {
    {% if k3s_platform_apps_gitea_enabled | bool %}
        "Gitea OIDC": [
            {"matching_mode": "strict", "url": "https://{{ k3s_platform_apps_gitea_domain }}/user/oauth2/authentik/callback"},
            {"matching_mode": "strict", "url": "https://{{ k3s_platform_apps_gitea_public_domain }}/user/oauth2/authentik/callback"},
        ],
    {% endif %}
    {% if k3s_platform_apps_netbox_enabled | bool %}
        "NetBox OIDC": [
            {"matching_mode": "strict", "url": "https://{{ k3s_platform_apps_netbox_domain }}/oauth/complete/oidc/"},
        ],
    {% endif %}
    {% if k3s_platform_apps_outline_enabled | bool %}
        "Outline OIDC": [
            {"matching_mode": "strict", "url": "https://{{ k3s_platform_apps_outline_domain }}/auth/oidc.callback"},
        ],
    {% endif %}
    {% if k3s_platform_apps_semaphore_enabled | bool %}
        "Semaphore OIDC": [
            {"matching_mode": "strict", "url": "https://{{ k3s_platform_apps_semaphore_domain }}/api/auth/oidc/authentik/redirect/"},
        ],
    {% endif %}
    {% if k3s_platform_apps_homepage_enabled | bool %}
        "Portal ForwardAuth": [
            {"matching_mode": "strict", "redirect_uri_type": "authorization", "url": "https://{{ k3s_platform_apps_homepage_domain }}/outpost.goauthentik.io/callback?X-authentik-auth-callback=true"},
            {"matching_mode": "strict", "redirect_uri_type": "authorization", "url": "https://{{ k3s_platform_apps_homepage_domain }}?X-authentik-auth-callback=true"},
        ],
    {% endif %}
    {% if k3s_platform_apps_n8n_enabled | bool %}
        "n8n ForwardAuth": [
            {"matching_mode": "strict", "redirect_uri_type": "authorization", "url": "https://{{ k3s_platform_apps_n8n_domain }}/outpost.goauthentik.io/callback?X-authentik-auth-callback=true"},
            {"matching_mode": "strict", "redirect_uri_type": "authorization", "url": "https://{{ k3s_platform_apps_n8n_domain }}?X-authentik-auth-callback=true"},
        ],
    {% endif %}
    }

    changed = False
    for provider_name, desired_entries in expected.items():
        try:
            provider = OAuth2Provider.objects.get(name=provider_name)
        except OAuth2Provider.DoesNotExist:
            print(f"SKIP missing provider {provider_name}")
            continue
        original_entries = list(provider._redirect_uris or [])
        entries = [
            entry for entry in original_entries
            if ".k3s.lenmail.de" not in entry.get("url", "")
        ]
        removed = len(original_entries) - len(entries)
        existing_urls = {entry.get("url") for entry in entries}
        added = []
        for entry in desired_entries:
            if entry["url"] in existing_urls:
                continue
            entries.append(entry)
            added.append(entry["url"])
        if added or removed:
            provider._redirect_uris = entries
            provider.save(update_fields=["_redirect_uris"])
            changed = True
            print(f"UPDATE {provider_name} add={'|'.join(added)} removed={removed}")
        else:
            print(f"OK {provider_name}")
    print(f"CHANGED {changed}")
    PY
  args:
    executable: /bin/bash
  register: k3s_platform_apps_authentik_redirects
  changed_when: "'CHANGED True' in k3s_platform_apps_authentik_redirects.stdout"
  become: true
  when:
    - k3s_platform_apps_authentik_enabled | bool
    - k3s_platform_apps_authentik_server_replicas | int > 0
  tags: k3s_platform_apps

- name: Remove legacy product alias ingresses
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ item.namespace }} delete ingress {{ item.name }}
      --ignore-not-found=true
  loop:
    - {namespace: "{{ k3s_platform_apps_namespace }}", name: product-aliases}
    - {namespace: "{{ k3s_platform_apps_namespace }}", name: product-forwardauth-aliases}
    - {namespace: "{{ k3s_platform_apps_namespace }}", name: product-n8n-machine-endpoints}
    - {namespace: monitoring, name: product-observability-aliases}
    - {namespace: monitoring, name: product-observability-forwardauth-aliases}
  register: k3s_platform_apps_legacy_alias_cleanup
  changed_when: "'deleted' in k3s_platform_apps_legacy_alias_cleanup.stdout"
  become: true
  when: not (k3s_platform_apps_product_aliases_enabled | bool)
  tags: k3s_platform_apps

- name: Wait for Gitea rollout
  ansible.builtin.command:
    cmd: "kubectl -n {{ k3s_platform_apps_namespace }} rollout status deployment/gitea --timeout=300s"
  register: k3s_platform_apps_gitea_rollout
  until: k3s_platform_apps_gitea_rollout.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  when:
    - k3s_platform_apps_gitea_enabled | bool
    - k3s_platform_apps_gitea_replicas | int > 0
  tags: k3s_platform_apps

- name: Reconcile Gitea OIDC discovery URL
  ansible.builtin.shell: |
    set -euo pipefail
    source_id="$(
      kubectl -n {{ k3s_platform_apps_namespace }} exec deploy/gitea -- su git -s /bin/sh -c 'gitea admin auth list --config /data/gitea/conf/app.ini' |
      awk '$2 == "authentik" {print $1; exit}'
    )"
    test -n "$source_id"
    kubectl -n {{ k3s_platform_apps_namespace }} exec deploy/gitea -- su git -s /bin/sh -c \
      "gitea admin auth update-oauth --config /data/gitea/conf/app.ini --id '$source_id' --name authentik --provider openidConnect --auto-discover-url https://{{ k3s_platform_apps_authentik_domain }}/application/o/gitea/.well-known/openid-configuration --scopes openid --scopes profile --scopes email --scopes groups"
  args:
    executable: /bin/bash
  register: k3s_platform_apps_gitea_oidc_reconcile
  changed_when: "'Updated authentication source' in k3s_platform_apps_gitea_oidc_reconcile.stdout"
  become: true
  when:
    - k3s_platform_apps_gitea_enabled | bool
    - k3s_platform_apps_gitea_replicas | int > 0
  tags: k3s_platform_apps

- name: Wait for Semaphore rollout
  ansible.builtin.command:
    cmd: "kubectl -n {{ k3s_platform_apps_namespace }} rollout status deployment/semaphore --timeout=300s"
  register: k3s_platform_apps_semaphore_rollout
  until: k3s_platform_apps_semaphore_rollout.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  when:
    - k3s_platform_apps_semaphore_enabled | bool
    - k3s_platform_apps_semaphore_replicas | int > 0
  tags: k3s_platform_apps

- name: Reconcile Gitea runner registration token
  ansible.builtin.shell: |
    set -euo pipefail
    token="$(kubectl -n {{ k3s_platform_apps_namespace }} exec deploy/gitea -- su git -s /bin/sh -c 'gitea actions generate-runner-token' | tr -d '\r\n')"
    test -n "$token"
    b64="$(printf %s "$token" | base64 -w0)"
    kubectl -n {{ k3s_platform_apps_namespace }} patch secret {{ k3s_platform_apps_runtime_secret_name }} --type merge -p "{\"data\":{\"GITEA_RUNNER_REGISTRATION_TOKEN\":\"$b64\"}}" >/dev/null
  args:
    executable: /bin/bash
  changed_when: false
  become: true
  no_log: true
  when:
    - k3s_platform_apps_gitea_enabled | bool
    - k3s_platform_apps_gitea_runner_enabled | bool
    - k3s_platform_apps_gitea_replicas | int > 0
  tags: k3s_platform_apps

- name: Wait for Gitea runner rollout
  ansible.builtin.command:
    cmd: "kubectl -n {{ k3s_platform_apps_namespace }} rollout status deployment/gitea-runner --timeout=300s"
  register: k3s_platform_apps_gitea_runner_rollout
  until: k3s_platform_apps_gitea_runner_rollout.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  when:
    - k3s_platform_apps_gitea_runner_enabled | bool
    - k3s_platform_apps_gitea_runner_replicas | int > 0
  tags: k3s_platform_apps

- name: Wait for Semaphore runner rollout
  ansible.builtin.command:
    cmd: "kubectl -n {{ k3s_platform_apps_namespace }} rollout status deployment/semaphore-runner --timeout=300s"
  register: k3s_platform_apps_semaphore_runner_rollout
