---
- name: Validate k3s platform app inputs
  ansible.builtin.assert:
    that:
      - k3s_platform_apps_namespace | length > 0
      - k3s_platform_apps_homepage_domain | length > 0
      - k3s_platform_apps_ingress_class | length > 0
    fail_msg: "k3s_platform_apps requires namespace, homepage domain and ingress class."
  tags: k3s_platform_apps

- name: Ensure platform app work directory exists
  ansible.builtin.file:
    path: "{{ k3s_platform_apps_work_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  tags: k3s_platform_apps

- name: Remove stale rendered platform app manifests
  ansible.builtin.command:
    cmd: "find {{ k3s_platform_apps_work_dir }} -maxdepth 1 -type f -name '*.yaml' -delete"
  changed_when: false
  become: true
  tags: k3s_platform_apps

- name: Render sensitive platform runtime secret
  ansible.builtin.template:
    src: 05-runtime-secret.yaml.j2
    dest: "{{ k3s_platform_apps_work_dir }}/05-runtime-secret.yaml"
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  when: k3s_platform_apps_runtime_env | length > 0
  tags: k3s_platform_apps

- name: Render platform app manifests
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ k3s_platform_apps_work_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - 00-namespace.yaml
    - 01-network-policy.yaml
    - 10-homepage.yaml
    - 20-blackbox.yaml
    - 30-grafana-dashboard.yaml
    - 40-observability-runtime.yaml
    - 41-data-services.yaml
    - 50-n8n.yaml
    - 51-outline.yaml
    - 52-netbox.yaml
    - 53-authentik.yaml
    - 54-gitea.yaml
    - 55-semaphore.yaml
    - 56-product-aliases.yaml
    - 57-external-services.yaml
  become: true
  tags: k3s_platform_apps

- name: Apply platform app manifests
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ k3s_platform_apps_work_dir }}"
  register: k3s_platform_apps_apply
  changed_when: "'configured' in k3s_platform_apps_apply.stdout or 'created' in k3s_platform_apps_apply.stdout"
  become: true
  tags: k3s_platform_apps

- name: Remove undeclared platform blackbox probes
  ansible.builtin.shell: |
    set -euo pipefail
    desired=(
    {% for target in k3s_platform_apps_blackbox_targets %}
      "platform-bus-{{ target.name }}"
    {% endfor %}
    )
    deleted=0
    while IFS= read -r current; do
      [[ -n "$current" ]] || continue
      keep=0
      for expected in "${desired[@]}"; do
        if [[ "$current" == "$expected" ]]; then
          keep=1
          break
        fi
      done
      if [[ "$keep" == "0" ]]; then
        kubectl -n monitoring delete probe "$current"
        deleted=1
      fi
    done < <(
      kubectl -n monitoring get probes \
        -l app.kubernetes.io/part-of=platform-bus \
        -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}'
    )
    [[ "$deleted" == "0" ]] || echo deleted
  args:
    executable: /bin/bash
  register: k3s_platform_apps_obsolete_probes
  changed_when: "'deleted' in k3s_platform_apps_obsolete_probes.stdout"
  become: true
  when: k3s_platform_apps_blackbox_enabled | bool
  tags: k3s_platform_apps

- name: Remove retired private registry and CA objects
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ k3s_platform_apps_namespace }} delete
      secret/registry-bus-lenmail configmap/platform-bus-ca-chain
      --ignore-not-found=true
  register: k3s_platform_apps_registry_secret_delete
  changed_when: "'deleted' in k3s_platform_apps_registry_secret_delete.stdout"
  become: true
  tags: k3s_platform_apps

- name: Remove legacy PostgreSQL resources after HA migration
  ansible.builtin.command:
    cmd: >-
      kubectl -n {{ k3s_platform_apps_namespace }} delete
      statefulset/postgres service/postgres configmap/postgres-init
      pvc/data-postgres-0 --ignore-not-found=true
  register: k3s_platform_apps_legacy_postgres_service_delete
  changed_when: "'deleted' in k3s_platform_apps_legacy_postgres_service_delete.stdout"
  become: true
  when:
    - k3s_platform_apps_data_services_enabled | bool
    - not (k3s_platform_apps_postgres_enabled | bool)
  tags: k3s_platform_apps

- name: Wait for homepage rollout
  ansible.builtin.command:
    cmd: "kubectl -n {{ k3s_platform_apps_namespace }} rollout status deployment/homepage --timeout=300s"
  register: k3s_platform_apps_homepage_rollout
  until: k3s_platform_apps_homepage_rollout.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  when: k3s_platform_apps_homepage_enabled | bool
  tags: k3s_platform_apps

- name: Wait for blackbox exporter rollout
