- name: Reconcile platform PostgreSQL logical databases and roles
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl -n {{ k3s_platform_apps_namespace }} exec postgres-0 -- bash -ec '
      set -euo pipefail
      export PGPASSWORD="$POSTGRES_PASSWORD"

      create_db_and_user() {
        local db="$1"
        local user="$2"
        local pass="$3"

        psql -v ON_ERROR_STOP=1 \
          -v app_db="$db" \
          -v app_user="$user" \
          -v app_pass="$pass" \
          --username "$POSTGRES_USER" \
          --dbname "$POSTGRES_DB" \
          <<< "SELECT format('"'"'CREATE ROLE %I LOGIN PASSWORD %L'"'"', :'"'"'app_user'"'"', :'"'"'app_pass'"'"') WHERE NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = :'"'"'app_user'"'"')\\gexec"
        psql -v ON_ERROR_STOP=1 \
          -v app_db="$db" \
          -v app_user="$user" \
          --username "$POSTGRES_USER" \
          --dbname "$POSTGRES_DB" \
          <<< "SELECT format('"'"'CREATE DATABASE %I OWNER %I'"'"', :'"'"'app_db'"'"', :'"'"'app_user'"'"') WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'"'"'app_db'"'"')\\gexec"
        psql -v ON_ERROR_STOP=1 \
          -v app_db="$db" \
          -v app_user="$user" \
          --username "$POSTGRES_USER" \
          --dbname "$POSTGRES_DB" \
          <<< "SELECT format('"'"'GRANT ALL PRIVILEGES ON DATABASE %I TO %I'"'"', :'"'"'app_db'"'"', :'"'"'app_user'"'"')\\gexec"
      }

      create_from_prefix() {
        local prefix="$1"
        local db_var="${prefix}_DB"
        local user_var="${prefix}_DB_USER"
        local pass_var="${prefix}_DB_PASS"

        if [[ -n "${!db_var:-}" && -n "${!user_var:-}" && -n "${!pass_var:-}" ]]; then
          create_db_and_user "${!db_var}" "${!user_var}" "${!pass_var}"
        fi
      }

      create_from_prefix AUTHENTIK
      create_from_prefix GITEA
      create_from_prefix SEMAPHORE
      create_from_prefix OUTLINE
      create_from_prefix NETBOX
      create_from_prefix GRAFANA
      create_from_prefix PDNS
      create_from_prefix PDNS_ADMIN
      create_from_prefix N8N

      if [[ -n "${NETBOX_DB:-}" && -n "${NETBOX_DB_USER:-}" ]]; then
        psql -v ON_ERROR_STOP=1 \
          -v app_db="$NETBOX_DB" \
          -v app_user="$NETBOX_DB_USER" \
          --username "$POSTGRES_USER" \
          --dbname "$POSTGRES_DB" \
          <<< "SELECT format('"'"'GRANT CREATE ON DATABASE %I TO %I'"'"', :'"'"'app_db'"'"', :'"'"'app_user'"'"')\\gexec"
      fi
    '
  args:
    executable: /bin/bash
  become: true
  no_log: true
  when:
    - k3s_platform_apps_data_services_enabled | bool
    - k3s_platform_apps_postgres_enabled | bool
  tags: k3s_platform_apps

