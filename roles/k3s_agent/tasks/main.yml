---
- name: Gather service facts
  ansible.builtin.service_facts:
  tags: k3s_agent

- name: Validate supported platform
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - k3s_token | length > 0
      - k3s_server_url | length > 0
    fail_msg: "The k3s_agent role requires Debian, k3s_token and k3s_server_url."
  tags: k3s_agent

- name: Install k3s agent dependencies
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - iptables
      - iproute2
    state: present
  become: true
  tags: k3s_agent

- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true
  tags: k3s_agent

- name: Configure k3s agent
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_file }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s-agent
  become: true
  tags: k3s_agent

- name: Download k3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: /usr/local/sbin/install-k3s.sh
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: k3s_agent

- name: Install k3s agent
  ansible.builtin.command:
    cmd: /usr/local/sbin/install-k3s.sh agent
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version | default('') }}"
  become: true
  tags: k3s_agent

- name: Ensure k3s-agent service is enabled and started
  ansible.builtin.service:
    name: k3s-agent
    enabled: true
    state: started
  become: true
  tags: k3s_agent

