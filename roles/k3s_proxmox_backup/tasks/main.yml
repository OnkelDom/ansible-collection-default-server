---
- name: Validate Proxmox backup inputs
  ansible.builtin.assert:
    that:
      - k3s_proxmox_backup_target_host | length > 0
      - k3s_proxmox_backup_job_id | length > 0
      - k3s_proxmox_backup_storage | length > 0
      - k3s_proxmox_backup_vm_names | length > 0
    fail_msg: "k3s_proxmox_backup requires a target, storage and VM names."
  tags: k3s_proxmox_backup

- name: Register the Proxmox management endpoint
  ansible.builtin.add_host:
    name: k3s_proxmox_backup_target
    ansible_host: "{{ k3s_proxmox_backup_target_host }}"
    ansible_user: "{{ k3s_proxmox_backup_target_user }}"
  changed_when: false
  tags: k3s_proxmox_backup

- name: Read Proxmox virtual machines
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - /cluster/resources
      - --type
      - vm
      - --output-format
      - json
  register: k3s_proxmox_backup_resources
  changed_when: false
  become: true
  delegate_to: k3s_proxmox_backup_target
  tags: k3s_proxmox_backup

- name: Resolve configured VM names to Proxmox IDs
  ansible.builtin.set_fact:
    k3s_proxmox_backup_vmids: >-
      {{
        k3s_proxmox_backup_resources.stdout
        | from_json
        | selectattr('name', 'in', k3s_proxmox_backup_vm_names)
        | map(attribute='vmid')
        | map('string')
        | sort
        | list
      }}
  tags: k3s_proxmox_backup

- name: Validate all backup VMs were resolved
  ansible.builtin.assert:
    that:
      - k3s_proxmox_backup_vmids | length == k3s_proxmox_backup_vm_names | length
    fail_msg: "Not all configured k3s VM names exist in Proxmox."
  tags: k3s_proxmox_backup

- name: Read current Proxmox backup job
  ansible.builtin.command:
    argv:
      - pvesh
      - get
      - "/cluster/backup/{{ k3s_proxmox_backup_job_id }}"
      - --output-format
      - json
  register: k3s_proxmox_backup_current
  changed_when: false
  failed_when: false
  become: true
  delegate_to: k3s_proxmox_backup_target
  tags: k3s_proxmox_backup

- name: Create Proxmox backup job
  ansible.builtin.command:
    argv:
      - pvesh
      - create
      - /cluster/backup
      - --id
      - "{{ k3s_proxmox_backup_job_id }}"
      - --storage
      - "{{ k3s_proxmox_backup_storage }}"
      - --vmid
      - "{{ k3s_proxmox_backup_vmids | join(',') }}"
      - --schedule
      - "{{ k3s_proxmox_backup_schedule }}"
      - --mode
      - "{{ k3s_proxmox_backup_mode }}"
      - --enabled
      - "1"
      - --repeat-missed
      - "{{ 1 if k3s_proxmox_backup_repeat_missed | bool else 0 }}"
      - --prune-backups
      - "{{ k3s_proxmox_backup_prune }}"
      - --comment
      - "{{ k3s_proxmox_backup_comment }}"
  become: true
  delegate_to: k3s_proxmox_backup_target
  when: k3s_proxmox_backup_current.rc != 0
  tags: k3s_proxmox_backup

- name: Reconcile Proxmox backup job
  ansible.builtin.command:
    argv:
      - pvesh
      - set
      - "/cluster/backup/{{ k3s_proxmox_backup_job_id }}"
      - --storage
      - "{{ k3s_proxmox_backup_storage }}"
      - --vmid
      - "{{ k3s_proxmox_backup_vmids | join(',') }}"
      - --schedule
      - "{{ k3s_proxmox_backup_schedule }}"
      - --mode
      - "{{ k3s_proxmox_backup_mode }}"
      - --enabled
      - "1"
      - --repeat-missed
      - "{{ 1 if k3s_proxmox_backup_repeat_missed | bool else 0 }}"
      - --prune-backups
      - "{{ k3s_proxmox_backup_prune }}"
      - --comment
      - "{{ k3s_proxmox_backup_comment }}"
  vars:
    k3s_proxmox_backup_current_job: "{{ k3s_proxmox_backup_current.stdout | from_json }}"
  become: true
  delegate_to: k3s_proxmox_backup_target
  when:
    - k3s_proxmox_backup_current.rc == 0
    - >-
      k3s_proxmox_backup_current_job.storage != k3s_proxmox_backup_storage or
      k3s_proxmox_backup_current_job.vmid != (k3s_proxmox_backup_vmids | join(',')) or
      k3s_proxmox_backup_current_job.schedule != k3s_proxmox_backup_schedule or
      k3s_proxmox_backup_current_job.mode != k3s_proxmox_backup_mode or
      k3s_proxmox_backup_current_job.enabled | int != 1 or
      k3s_proxmox_backup_current_job['repeat-missed'] | int != (1 if k3s_proxmox_backup_repeat_missed | bool else 0) or
      k3s_proxmox_backup_current_job.comment != k3s_proxmox_backup_comment
  tags: k3s_proxmox_backup
