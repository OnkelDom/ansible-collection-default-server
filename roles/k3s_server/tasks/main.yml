---
- name: Gather service facts
  ansible.builtin.service_facts:
  tags: k3s_server

- name: Validate supported platform
  ansible.builtin.assert:
    that:
      - ansible_os_family == "Debian"
      - k3s_token | length > 0
    fail_msg: "The k3s_server role requires Debian and a non-empty k3s_token."
  tags: k3s_server

- name: Install k3s server dependencies
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - iptables
      - iproute2
    state: present
  become: true
  tags: k3s_server

- name: Ensure k3s config directory exists
  ansible.builtin.file:
    path: "{{ k3s_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true
  tags: k3s_server

- name: Configure k3s server
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_file }}"
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s
  become: true
  tags: k3s_server

- name: Download k3s installer
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: /usr/local/sbin/install-k3s.sh
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: k3s_server

- name: Install k3s server
  ansible.builtin.command:
    cmd: /usr/local/sbin/install-k3s.sh server
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version | default('') }}"
  become: true
  tags: k3s_server

- name: Ensure k3s service is enabled and started
  ansible.builtin.service:
    name: k3s
    enabled: true
    state: started
  become: true
  tags: k3s_server

- name: Wait for local k3s API
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ k3s_api_port }}"
    timeout: 180
  tags: k3s_server

- name: Ensure k3s server node taints are applied
  ansible.builtin.shell: |
    set -euo pipefail
    python3 - {{ inventory_hostname | quote }} {{ item | quote }} <<'PY'
    import json
    import subprocess
    import sys

    node_name = sys.argv[1]
    taint = sys.argv[2]
    key_value, effect = taint.rsplit(":", 1)
    if "=" in key_value:
        key, value = key_value.split("=", 1)
    else:
        key, value = key_value, ""

    node = json.loads(subprocess.check_output(
        ["kubectl", "get", "node", node_name, "-o", "json"],
        text=True,
    ))
    for existing in node.get("spec", {}).get("taints", []) or []:
        if (
            existing.get("key") == key
            and existing.get("value", "") == value
            and existing.get("effect") == effect
        ):
            print("present")
            sys.exit(0)

    subprocess.check_call(["kubectl", "taint", "node", node_name, taint, "--overwrite"])
    print("changed")
    PY
  args:
    executable: /bin/bash
  loop: "{{ k3s_node_taints }}"
  register: k3s_server_node_taint_result
  changed_when: "'changed' in k3s_server_node_taint_result.stdout"
  become: true
  when: k3s_node_taints | length > 0
  tags: k3s_server
