---
k3s_version: ""
k3s_token: ""
k3s_server_url: ""
k3s_is_primary_server: false
k3s_node_ip: "{{ ansible_default_ipv4.address }}"
k3s_advertise_address: "{{ ansible_default_ipv4.address }}"
k3s_node_interface: "{{ ansible_default_ipv4.interface }}"
k3s_api_host: "{{ ansible_fqdn }}"
k3s_api_port: 6443
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16
k3s_cluster_dns: 10.43.0.10
k3s_cluster_domain: cluster.local
k3s_flannel_backend: vxlan
k3s_disable_components:
  - servicelb
k3s_node_taints: []
k3s_tls_sans: []
k3s_secrets_encryption: true
k3s_write_kubeconfig_mode: "0640"
k3s_etcd_snapshot_schedule_cron: "0 */6 * * *"
k3s_etcd_snapshot_retention: 14
k3s_etcd_snapshot_compress: true
k3s_etcd_snapshot_dir: /var/lib/rancher/k3s/server/db/snapshots
k3s_config_dir: /etc/rancher/k3s
k3s_config_file: "{{ k3s_config_dir }}/config.yaml"
k3s_install_url: https://get.k3s.io
