---
- name: Validate k3s addon inputs
  ansible.builtin.assert:
    that:
      - k3s_addons_ceph_cluster_id | length > 0
      - k3s_addons_ceph_monitors | length > 0
      - k3s_addons_ceph_user_key | length > 0
      - k3s_addons_acme_email | length > 0
      - k3s_addons_hetzner_api_token | length > 0
      - not (k3s_addons_powerdns_enabled | bool) or k3s_addons_powerdns_zone | length > 0
      - not (k3s_addons_powerdns_enabled | bool) or k3s_addons_powerdns_nameserver | length > 0
      - not (k3s_addons_powerdns_enabled | bool) or k3s_addons_powerdns_vip | length > 0
      - not (k3s_addons_powerdns_enabled | bool) or k3s_addons_powerdns_api_key | length > 0
      - not (k3s_addons_powerdns_enabled | bool) or k3s_addons_powerdns_postgres_password | length > 0
      - not (k3s_addons_observability_enabled | bool) or k3s_addons_observability_chart_version | length > 0
      - not (k3s_addons_observability_enabled | bool) or k3s_addons_grafana_domain | length > 0
      - not (k3s_addons_observability_enabled | bool) or k3s_addons_grafana_admin_password | length > 0
    fail_msg: "k3s_addons requires Ceph, ACME and Hetzner variables."
  tags: k3s_addons

- name: Ensure addon work directories exist
  ansible.builtin.file:
    path: "{{ k3s_addons_work_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - phase0/crds
    - phase0/controller
    - phase1
    - phase2
    - phase3
    - phase4
  become: true
  tags: k3s_addons

- name: Download pinned CSI snapshot API manifests
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/{{ k3s_addons_snapshot_controller_version }}/{{ item.src }}"
    dest: "{{ k3s_addons_work_dir }}/phase0/{{ item.dest }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - src: client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
      dest: crds/volumesnapshotclasses.yaml
    - src: client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
      dest: crds/volumesnapshotcontents.yaml
    - src: client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
      dest: crds/volumesnapshots.yaml
    - src: deploy/kubernetes/snapshot-controller/rbac-snapshot-controller.yaml
      dest: controller/rbac.yaml
    - src: deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml
      dest: controller/deployment.yaml
  become: true
  when: k3s_addons_snapshot_controller_enabled | bool
  tags: k3s_addons

- name: Apply CSI snapshot API CRDs
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ k3s_addons_work_dir }}/phase0/crds"
  register: k3s_addons_snapshot_crds
  changed_when: "'configured' in k3s_addons_snapshot_crds.stdout or 'created' in k3s_addons_snapshot_crds.stdout"
  become: true
  when: k3s_addons_snapshot_controller_enabled | bool
  tags: k3s_addons

- name: Apply CSI snapshot controller
  ansible.builtin.command:
    cmd: "kubectl -n kube-system apply -f {{ k3s_addons_work_dir }}/phase0/controller"
  register: k3s_addons_snapshot_controller
  changed_when: "'configured' in k3s_addons_snapshot_controller.stdout or 'created' in k3s_addons_snapshot_controller.stdout"
  become: true
  when: k3s_addons_snapshot_controller_enabled | bool
  tags: k3s_addons

- name: Remove stale rendered addon manifests
  ansible.builtin.command:
    cmd: "find {{ k3s_addons_work_dir }} -mindepth 2 -maxdepth 2 -type f -name '*.yaml' -delete"
  changed_when: false
  become: true
  tags: k3s_addons

- name: Render phase 1 addon manifests
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ k3s_addons_work_dir }}/phase1/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - 00-namespaces.yaml
    - 10-ceph-csi-rbd.yaml
    - 11-ceph-csi-cephfs.yaml
    - 20-cert-manager.yaml
    - 25-cloudnative-pg.yaml
    - 30-traefik.yaml
    - 50-powerdns.yaml
  become: true
  no_log: true
  tags: k3s_addons

- name: Remove stale PowerDNS zone seed job
  ansible.builtin.command:
    cmd: kubectl -n dns delete job powerdns-zone-seed --ignore-not-found=true
  changed_when: false
  failed_when: false
  become: true
  when: k3s_addons_powerdns_enabled | bool
  tags: k3s_addons

- name: Apply phase 1 addon manifests
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ k3s_addons_work_dir }}/phase1"
  register: k3s_addons_phase1
  changed_when: "'configured' in k3s_addons_phase1.stdout or 'created' in k3s_addons_phase1.stdout"
  become: true
  tags: k3s_addons

- name: Remove stale Ceph CSI nodeplugin pods from tainted control-plane nodes
  ansible.builtin.shell: |
    set -euo pipefail
    python3 <<'PY'
    import json
    import subprocess

    nodes = json.loads(subprocess.check_output(
        ["kubectl", "get", "nodes", "-o", "json"], text=True
    ))
    tainted_nodes = {
        node["metadata"]["name"]
        for node in nodes["items"]
        if any(
            taint.get("key") == "node-role.kubernetes.io/control-plane"
            and taint.get("effect") == "NoSchedule"
            for taint in node.get("spec", {}).get("taints", [])
        )
    }
    pods = json.loads(subprocess.check_output(
        ["kubectl", "-n", "ceph-csi", "get", "pods", "-l", "component=nodeplugin", "-o", "json"],
        text=True,
    ))
    stale = [
        pod["metadata"]["name"]
        for pod in pods["items"]
        if pod.get("spec", {}).get("nodeName") in tainted_nodes
    ]
    if stale:
        subprocess.check_call(["kubectl", "-n", "ceph-csi", "delete", "pod", *stale])
        print("changed")
    else:
        print("present")
    PY
  args:
    executable: /bin/bash
  register: k3s_addons_ceph_stale_nodeplugins
  changed_when: "'changed' in k3s_addons_ceph_stale_nodeplugins.stdout"
  become: true
  tags: k3s_addons

- name: Restart PowerDNS authoritative pods after secret/config updates
  ansible.builtin.command:
    cmd: kubectl -n dns rollout restart daemonset/powerdns-auth
  changed_when: false
  failed_when: false
  become: true
  when: k3s_addons_powerdns_enabled | bool
  tags: k3s_addons

- name: Wait for cert-manager CRDs
  ansible.builtin.command:
    cmd: kubectl wait --for=condition=Established crd/clusterissuers.cert-manager.io --timeout=300s
  register: k3s_addons_certmanager_crd
  until: k3s_addons_certmanager_crd.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  tags: k3s_addons

- name: Wait for CloudNativePG operator
  ansible.builtin.command:
    cmd: kubectl -n cnpg-system rollout status deployment/cloudnative-pg --timeout=600s
  register: k3s_addons_cloudnative_pg_rollout
  until: k3s_addons_cloudnative_pg_rollout.rc == 0
  retries: 30
  delay: 20
  changed_when: false
  become: true
  when: k3s_addons_cloudnative_pg_enabled | bool
  tags: k3s_addons

- name: Wait for cert-manager pods
  ansible.builtin.command:
    cmd: kubectl -n cert-manager wait --for=condition=Ready pod --all --timeout=300s
  register: k3s_addons_certmanager_pods
  until: k3s_addons_certmanager_pods.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  tags: k3s_addons

- name: Render phase 2 addon manifests
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ k3s_addons_work_dir }}/phase2/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - 21-cert-manager-hetzner-webhook.yaml
  become: true
  no_log: true
  tags: k3s_addons

- name: Apply phase 2 addon manifests
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ k3s_addons_work_dir }}/phase2"
  register: k3s_addons_phase2
  changed_when: "'configured' in k3s_addons_phase2.stdout or 'created' in k3s_addons_phase2.stdout"
  become: true
  tags: k3s_addons

- name: Wait for cert-manager Hetzner webhook pod
  ansible.builtin.command:
    cmd: kubectl -n cert-manager wait --for=condition=Ready pod -l release=cert-manager-webhook-hetzner --timeout=300s
  register: k3s_addons_hetzner_webhook_pods
  until: k3s_addons_hetzner_webhook_pods.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  tags: k3s_addons

- name: Render phase 3 addon manifests
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ k3s_addons_work_dir }}/phase3/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - 40-clusterissuer.yaml
  become: true
  no_log: true
  tags: k3s_addons

- name: Apply phase 3 addon manifests
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ k3s_addons_work_dir }}/phase3"
  register: k3s_addons_phase3
  changed_when: "'configured' in k3s_addons_phase3.stdout or 'created' in k3s_addons_phase3.stdout"
  become: true
  tags: k3s_addons

- name: Render phase 4 addon manifests
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ k3s_addons_work_dir }}/phase4/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - 60-observability.yaml
  become: true
  no_log: true
  when: k3s_addons_observability_enabled | bool
  tags: k3s_addons

- name: Apply phase 4 addon manifests
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ k3s_addons_work_dir }}/phase4"
  register: k3s_addons_phase4
  changed_when: "'configured' in k3s_addons_phase4.stdout or 'created' in k3s_addons_phase4.stdout"
  become: true
  when: k3s_addons_observability_enabled | bool
  tags: k3s_addons

- name: Remove default annotation from local-path
  ansible.builtin.command:
    cmd: kubectl annotate storageclass local-path storageclass.kubernetes.io/is-default-class=false --overwrite
  register: k3s_addons_local_path_default
  changed_when: "'annotated' in k3s_addons_local_path_default.stdout"
  failed_when: false
  become: true
  tags: k3s_addons

- name: Wait for ceph-csi pods
  ansible.builtin.command:
    cmd: kubectl -n ceph-csi wait --for=condition=Ready pod --all --timeout=300s
  register: k3s_addons_ceph_pods
  until: k3s_addons_ceph_pods.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  tags: k3s_addons

- name: Wait for CSI snapshot controller
  ansible.builtin.command:
    cmd: kubectl -n kube-system rollout status deployment/snapshot-controller --timeout=300s
  register: k3s_addons_snapshot_controller_rollout
  until: k3s_addons_snapshot_controller_rollout.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  when: k3s_addons_snapshot_controller_enabled | bool
  tags: k3s_addons

- name: Wait for traefik pods
  ansible.builtin.command:
    cmd: kubectl -n traefik wait --for=condition=Ready pod --all --timeout=300s
  register: k3s_addons_traefik_pods
  until: k3s_addons_traefik_pods.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  tags: k3s_addons

- name: Wait for PowerDNS PostgreSQL
  ansible.builtin.command:
    cmd: kubectl -n dns rollout status statefulset/powerdns-postgres --timeout=300s
  register: k3s_addons_powerdns_postgres
  until: k3s_addons_powerdns_postgres.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  when: k3s_addons_powerdns_enabled | bool
  tags: k3s_addons

- name: Wait for kube-prometheus-stack HelmChart
  ansible.builtin.command:
    cmd: kubectl -n kube-system wait --for=condition=Complete job/helm-install-kube-prometheus-stack --timeout=900s
  register: k3s_addons_observability_chart
  until: k3s_addons_observability_chart.rc == 0
  retries: 30
  delay: 20
  changed_when: false
  become: true
  when: k3s_addons_observability_enabled | bool
  tags: k3s_addons

- name: Wait for monitoring workloads
  ansible.builtin.command:
    cmd: "{{ item }}"
  register: k3s_addons_monitoring_pods
  until: k3s_addons_monitoring_pods.rc == 0
  retries: 30
  delay: 20
  changed_when: false
  become: true
  loop:
    - kubectl -n monitoring rollout status deployment/kps-operator --timeout=300s
    - kubectl -n monitoring rollout status deployment/kube-prometheus-stack-grafana --timeout=300s
    - kubectl -n monitoring rollout status deployment/kube-prometheus-stack-kube-state-metrics --timeout=300s
    - kubectl -n monitoring rollout status daemonset/kube-prometheus-stack-prometheus-node-exporter --timeout=300s
    - kubectl -n monitoring rollout status statefulset/prometheus-kps-prometheus --timeout=300s
    - kubectl -n monitoring rollout status statefulset/alertmanager-kps-alertmanager --timeout=300s
  when: k3s_addons_observability_enabled | bool
  tags: k3s_addons

- name: Wait for Grafana certificate
  ansible.builtin.command:
    cmd: kubectl -n monitoring wait --for=condition=Ready certificate/k3s-grafana-tls --timeout=30s
  register: k3s_addons_grafana_certificate
  changed_when: false
  failed_when: false
  become: true
  when: k3s_addons_observability_enabled | bool
  tags: k3s_addons

- name: Wait for PowerDNS authoritative pods
  ansible.builtin.command:
    cmd: kubectl -n dns rollout status daemonset/powerdns-auth --timeout=300s
  register: k3s_addons_powerdns_auth
  until: k3s_addons_powerdns_auth.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  when: k3s_addons_powerdns_enabled | bool
  tags: k3s_addons

- name: Wait for PowerDNS zone seed job
  ansible.builtin.command:
    cmd: kubectl -n dns wait --for=condition=Complete job/powerdns-zone-seed --timeout=300s
  register: k3s_addons_powerdns_seed
  until: k3s_addons_powerdns_seed.rc == 0
  retries: 20
  delay: 15
  changed_when: false
  become: true
  when: k3s_addons_powerdns_enabled | bool
  tags: k3s_addons
