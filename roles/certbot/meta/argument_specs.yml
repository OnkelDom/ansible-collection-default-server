---
argument_specs:
  main:
    short_description: Entry point for the certbot role.
    description:
    - Validate variables for the `certbot` role.
    options:
      certbot_dns_provider:
        description:
        - DNS-01 provider for ACME validation.
        choices:
        - cloudflare
        - hetzner
        required: false
        type: str
      certbot_cloudflare_api_email:
        description:
        - Controls `certbot_cloudflare_api_email` for the `certbot` role.
        required: false
        type: str
      certbot_cloudflare_api_key:
        description:
        - Controls `certbot_cloudflare_api_key` for the `certbot` role.
        required: false
        type: str
      certbot_cloudflare_api_token:
        description:
        - Controls `certbot_cloudflare_api_token` for the `certbot` role.
        required: false
        type: str
      certbot_cloudflare_credentials_path:
        description:
        - Controls `certbot_cloudflare_credentials_path` for the `certbot` role.
        required: false
        type: str
      certbot_hetzner_api_token:
        description:
        - Hetzner Cloud DNS API token for the `certbot` role.
        required: false
        type: str
      certbot_hetzner_credentials_path:
        description:
        - Path for the Hetzner Cloud DNS credential file.
        required: false
        type: str
      certbot_hetzner_api_url:
        description:
        - Hetzner Cloud DNS API base URL.
        required: false
        type: str
      certbot_hetzner_ttl:
        description:
        - TTL for temporary Hetzner Cloud DNS TXT records.
        required: false
        type: int
      certbot_hetzner_hook_path:
        description:
        - Path for the Hetzner Cloud DNS Certbot hook.
        required: false
        type: str
      certbot_dns_propagation_seconds:
        description:
        - Controls `certbot_dns_propagation_seconds` for the `certbot` role.
        required: false
        type: int
      certbot_copy_to_ssl:
        description:
        - Controls `certbot_copy_to_ssl` for the `certbot` role.
        required: false
        type: bool
      certbot_copy_destination_dir:
        description:
        - Controls `certbot_copy_destination_dir` for the `certbot` role.
        required: false
        type: str
      certbot_renew_hook:
        description:
        - Controls `certbot_renew_hook` for the `certbot` role.
        required: false
        type: str
      certbot_acme_email:
        description:
        - Controls `certbot_acme_email` for the `certbot` role.
        required: false
        type: str
      certbot_certs:
        description:
        - Controls `certbot_certs` for the `certbot` role.
        required: false
        type: list
        elements: dict
