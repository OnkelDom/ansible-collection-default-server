---
k3s_postgres_ha_namespace: platform-bus
k3s_postgres_ha_cluster_name: postgres-ha
k3s_postgres_ha_instances: 3
k3s_postgres_ha_image: ghcr.io/cloudnative-pg/postgresql:16.10-system-trixie
k3s_postgres_ha_storage_class: ceph-rbd
k3s_postgres_ha_storage_size: 50Gi
k3s_postgres_ha_snapshot_class: ceph-rbd-snapclass
k3s_postgres_ha_source_service: postgres
k3s_postgres_ha_source_pod: postgres-0
k3s_postgres_ha_source_superuser: ""
k3s_postgres_ha_source_password: ""
k3s_postgres_ha_source_password_secret: platform-bus-runtime-env
k3s_postgres_ha_source_password_key: POSTGRES_SUPERPASS
k3s_postgres_ha_manifest_dir: /root/k3s-postgres-ha
k3s_postgres_ha_backup_dir: /root/k3s-postgres-ha/backups
k3s_postgres_ha_worker_memory_mb: 6144
k3s_postgres_ha_resize_workers: false
k3s_postgres_ha_proxmox_host: pve.lenmail.de
k3s_postgres_ha_proxmox_user: lenadmin
k3s_postgres_ha_worker_vms: []
k3s_postgres_ha_workloads: []
