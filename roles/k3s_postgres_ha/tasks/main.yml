---
- name: Validate PostgreSQL HA migration inputs
  ansible.builtin.assert:
    that:
      - k3s_postgres_ha_source_superuser | length > 0
      - k3s_postgres_ha_source_password | length > 0
      - k3s_postgres_ha_instances | int == 3
      - k3s_postgres_ha_worker_vms | length == 3
      - k3s_postgres_ha_workloads | length > 0
    fail_msg: "k3s_postgres_ha requires the source superuser, three workers and workload replicas."
  tags: k3s_postgres_ha

- name: Check whether the HA cluster already exists
  ansible.builtin.command:
    cmd: "kubectl -n {{ k3s_postgres_ha_namespace }} get cluster {{ k3s_postgres_ha_cluster_name }}"
  register: k3s_postgres_ha_existing
  changed_when: false
  failed_when: false
  become: true
  tags: k3s_postgres_ha

- name: Migrate the platform PostgreSQL cluster
  when: k3s_postgres_ha_existing.rc != 0
  block:
    - name: Register the Proxmox management endpoint
      ansible.builtin.add_host:
        name: k3s_postgres_ha_proxmox
        ansible_host: "{{ k3s_postgres_ha_proxmox_host }}"
        ansible_user: "{{ k3s_postgres_ha_proxmox_user }}"
      changed_when: false
      when: k3s_postgres_ha_resize_workers | bool

    - name: Stop database client workloads for a consistent import
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ k3s_postgres_ha_namespace }} scale
          {{ item.kind }}/{{ item.name }} --replicas=0
      loop: "{{ k3s_postgres_ha_workloads }}"
      changed_when: true
      become: true

    - name: Wait until database client workloads are stopped
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ k3s_postgres_ha_namespace }} wait
          --for=delete pod -l app.kubernetes.io/name={{ item.label }} --timeout=300s
      loop: "{{ k3s_postgres_ha_workloads | unique(attribute='label') }}"
      changed_when: false
      failed_when: false
      become: true

    - name: Resolve Proxmox VM IDs for k3s workers
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/resources, --type, vm, --output-format, json]
      register: k3s_postgres_ha_proxmox_resources
      changed_when: false
      become: true
      delegate_to: k3s_postgres_ha_proxmox
      when: k3s_postgres_ha_resize_workers | bool

    - name: Build worker VM resource map
      ansible.builtin.set_fact:
        k3s_postgres_ha_worker_resources: >-
          {{ k3s_postgres_ha_proxmox_resources.stdout | from_json
             | selectattr('name', 'in', k3s_postgres_ha_worker_vms)
             | sort(attribute='vmid') | list }}
      when: k3s_postgres_ha_resize_workers | bool

    - name: Validate all worker VMs were resolved
      ansible.builtin.assert:
        that:
          - k3s_postgres_ha_worker_resources | length == k3s_postgres_ha_worker_vms | length
      when: k3s_postgres_ha_resize_workers | bool

    - name: Increase worker memory in Proxmox
      ansible.builtin.command:
        argv: [qm, set, "{{ item.vmid | string }}", --hotplug, disk, --memory, "{{ k3s_postgres_ha_worker_memory_mb | string }}"]
      loop: "{{ k3s_postgres_ha_worker_resources }}"
      loop_control:
        label: "{{ item.name }}"
      become: true
      delegate_to: k3s_postgres_ha_proxmox
      when: k3s_postgres_ha_resize_workers | bool

    - name: Reboot resized workers one at a time
      ansible.builtin.shell: |
        set -euo pipefail
        qm shutdown {{ item.vmid | quote }} --timeout 60 || qm stop {{ item.vmid | quote }}
        qm start {{ item.vmid | quote }}
      args:
        executable: /bin/bash
      loop: "{{ k3s_postgres_ha_worker_resources }}"
      loop_control:
        label: "{{ item.name }}"
        pause: 45
      become: true
      delegate_to: k3s_postgres_ha_proxmox
      when: k3s_postgres_ha_resize_workers | bool

    - name: Wait for all workers to become Ready after resize
      ansible.builtin.command:
        cmd: "kubectl wait --for=condition=Ready node --selector='!node-role.kubernetes.io/control-plane' --timeout=600s"
      changed_when: false
      become: true
      when: k3s_postgres_ha_resize_workers | bool

    - name: Wait for source PostgreSQL after worker resize
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ k3s_postgres_ha_namespace }} rollout status
          statefulset/{{ k3s_postgres_ha_source_service }} --timeout=600s
      changed_when: false
      become: true

    - name: Ensure PostgreSQL migration directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop:
        - "{{ k3s_postgres_ha_manifest_dir }}"
        - "{{ k3s_postgres_ha_backup_dir }}"
      become: true

    - name: Create pre-migration logical PostgreSQL backup
      ansible.builtin.shell: |
        set -euo pipefail
        backup="{{ k3s_postgres_ha_backup_dir }}/platform-bus-$(date +%Y%m%dT%H%M%S).sql.gz"
        kubectl -n {{ k3s_postgres_ha_namespace }} exec {{ k3s_postgres_ha_source_pod }} -- bash -ec '
          export PGPASSWORD="$POSTGRES_PASSWORD"
          pg_dumpall --clean --if-exists --username "$POSTGRES_USER"
        ' | gzip -9 > "${backup}"
        test -s "${backup}"
        sha256sum "${backup}" > "${backup}.sha256"
        chmod 0600 "${backup}" "${backup}.sha256"
      args:
        executable: /bin/bash
      no_log: true
      become: true

    - name: Render CloudNativePG cluster manifest
      ansible.builtin.template:
        src: postgres-ha.yaml.j2
        dest: "{{ k3s_postgres_ha_manifest_dir }}/postgres-ha.yaml"
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true

    - name: Start CloudNativePG monolith import
      ansible.builtin.command:
        cmd: "kubectl apply -f {{ k3s_postgres_ha_manifest_dir }}/postgres-ha.yaml"
      register: k3s_postgres_ha_apply
      changed_when: "'created' in k3s_postgres_ha_apply.stdout or 'configured' in k3s_postgres_ha_apply.stdout"
      become: true

    - name: Wait for CloudNativePG cluster readiness
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ k3s_postgres_ha_namespace }} wait
          --for=condition=Ready cluster/{{ k3s_postgres_ha_cluster_name }} --timeout=1200s
      changed_when: false
      become: true

    - name: Read source database names
      ansible.builtin.shell: |
        set -euo pipefail
        kubectl -n {{ k3s_postgres_ha_namespace }} exec {{ k3s_postgres_ha_source_pod }} -- bash -ec '
          export PGPASSWORD="$POSTGRES_PASSWORD"
          psql --username "$POSTGRES_USER" --dbname postgres --tuples-only --no-align \
            --command "select datname from pg_database where datallowconn and datname <> '\''postgres'\'' order by 1"
        '
      args:
        executable: /bin/bash
      register: k3s_postgres_ha_source_databases
      changed_when: false
      become: true

    - name: Read imported database names
      ansible.builtin.shell: |
        set -euo pipefail
        primary="$(kubectl -n {{ k3s_postgres_ha_namespace }} get pod \
          -l cnpg.io/cluster={{ k3s_postgres_ha_cluster_name }},role=primary \
          -o jsonpath='{.items[0].metadata.name}')"
        kubectl -n {{ k3s_postgres_ha_namespace }} exec "${primary}" -- \
          psql --username postgres --dbname postgres --tuples-only --no-align \
          --command "select datname from pg_database where datallowconn and datname <> 'postgres' order by 1"
      args:
        executable: /bin/bash
      register: k3s_postgres_ha_target_databases
      changed_when: false
      become: true

    - name: Validate imported database inventory
      ansible.builtin.assert:
        that:
          - k3s_postgres_ha_source_databases.stdout_lines | sort == k3s_postgres_ha_target_databases.stdout_lines | sort
        fail_msg: "The CloudNativePG database inventory differs from the source."

  rescue:
    - name: Restore database client workload replicas after migration failure
      ansible.builtin.command:
        cmd: >-
          kubectl -n {{ k3s_postgres_ha_namespace }} scale
          {{ item.kind }}/{{ item.name }} --replicas={{ item.replicas }}
      loop: "{{ k3s_postgres_ha_workloads }}"
      changed_when: true
      become: true

    - name: Stop after PostgreSQL HA rollback
      ansible.builtin.fail:
        msg: "CloudNativePG migration failed. Applications were restored against the original PostgreSQL service."
  tags: k3s_postgres_ha
